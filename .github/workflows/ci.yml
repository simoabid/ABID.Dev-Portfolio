name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────
  # 1. Lint + Type-check + Format
  # ──────────────────────────────────────────
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Format check
        run: npm run format:check

  # ──────────────────────────────────────────
  # 2. Production Build
  # ──────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Build production bundle
        run: npm run build
        env:
          NODE_ENV: production

      - name: Report bundle sizes
        run: |
          echo "## 📦 Build Output" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          npm run build 2>&1 | grep -E "^(├|┌|└|Route|\+|  ├)" >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next/
          retention-days: 7

  # ──────────────────────────────────────────
  # 3. Accessibility Audit
  # ──────────────────────────────────────────
  accessibility:
    name: Accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .next/

      - name: Start server and run a11y audit
        run: |
          npm run start &
          SERVER_PID=$!
          sleep 5

          # Run axe-core audit against production build
          A11Y_BASE_URL=http://localhost:3000 npm run test:a11y || A11Y_EXIT=$?

          kill $SERVER_PID 2>/dev/null || true
          exit ${A11Y_EXIT:-0}
