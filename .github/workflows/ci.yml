name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────
  # 1. Lint + Type-check + Format
  # ──────────────────────────────────────────
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Format check
        run: npm run format:check

  # ──────────────────────────────────────────
  # 2. Production Build + Accessibility Audit
  # ──────────────────────────────────────────
  build:
    name: Build & Accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Build production bundle
        run: npm run build
        env:
          NODE_ENV: production

      - name: Report bundle sizes
        run: |
          echo "## 📦 Build Output" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat .next/trace 2>/dev/null | head -5 >> $GITHUB_STEP_SUMMARY || echo "Build completed successfully" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Run accessibility audit
        run: |
          npm run start &
          SERVER_PID=$!

          # Wait for server to be ready (up to 30 seconds)
          for i in $(seq 1 30); do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:3000 | grep -q "200"; then
              echo "✅ Server is ready"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "❌ Server failed to start within 30 seconds"
              kill $SERVER_PID 2>/dev/null || true
              exit 1
            fi
            sleep 1
          done

          # Run axe-core audit against production build
          A11Y_BASE_URL=http://localhost:3000 npm run test:a11y || A11Y_EXIT=$?

          kill $SERVER_PID 2>/dev/null || true
          exit ${A11Y_EXIT:-0}
